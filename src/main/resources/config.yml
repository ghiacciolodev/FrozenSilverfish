# Remove the AI from silverfish. Set to false and run /fsf reload to restore
# every silverfish this plugin has frozen.
enabled: true

# Turn off entity collisions for frozen silverfish. Saves the most when many
# silverfish are packed together, but they are no longer killed by entity
# cramming, so they can pile up if nobody kills them. Set to false if needed.
disable-collisions: true

# Frozen silverfish can't swim up, so they sink and drown after about 15
# seconds in water. Keep this true if they travel through water streams.
prevent-drowning: true

# Frozen silverfish can't walk off a campfire and burn on it. When a campfire
# hurts one, push it in a random direction until it falls off.
push-off-campfires: true

# Worlds where the plugin is active. An empty list means all worlds.
worlds: []
